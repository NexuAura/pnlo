name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cpp_compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            run: ./build/bin/pnlo
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            run: ./build/bin/pnlo
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            run: .\build\bin\pnlo.exe
          - os: macOS-latest
            c_compiler: clang
            cpp_compiler: clang++
            run: ./build/bin/pnlo

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run smoke test
        run: ${{ matrix.run }}